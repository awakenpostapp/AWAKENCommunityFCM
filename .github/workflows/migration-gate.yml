name: D1 migration gate

on:
  pull_request:
    paths:
      - 'backend/migrations/**'
      - 'backend/wrangler*.jsonc'
      - '.github/workflows/migration-gate.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to inspect (no migration is applied)'
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: List local migrations
        run: npx wrangler d1 migrations list community-football-club-manager --local
      - name: List selected remote migrations (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 migrations list community-football-club-manager --remote
