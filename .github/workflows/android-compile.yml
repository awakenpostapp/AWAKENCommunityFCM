name: Android compile

on:
  push:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.csproj.user'
      - 'Platforms/**'
      - 'Resources/**'
      - '.github/workflows/android-compile.yml'
  pull_request:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'Platforms/**'
      - 'Resources/**'
      - '.github/workflows/android-compile.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore CommunityFootballClubManager.csproj
      - name: Compile Android target
        run: dotnet build -t:Compile -f net10.0-android --no-restore -p:GenerateDocumentationFile=false
